  # ------------------------------------------------------------------ stability
  - id: stability
    always: true
    title: Stability
    rungs:
      - id: alive
        label: kernel alive with status ticks
        any: [{re: 'HKOBS \d+ \S+ t=\d+ |blazer-root: watch t \d+ ms'}]
        sample: 20261104-095002-a7-int5-r3
        next: 'No status ticks: reader.txt verdict'
        src: tools/read-ramdump.py
      - id: no-panic
        label: no unplanned panic
        gated: true
        all: [{metric: unplanned_panics, le: 0}]
        sample: 20261104-095002-a7-int5-r3
        next: 'Symbolize the panic (tools/read-ramdump.py --logs; crashdoc)'
        src: tools/read-ramdump.py
      - id: ran-300
        label: up >= 300 s
        gated: true
        all: [{metric: uptime_s, ge: 300}]
        sample: 20261104-095002-a7-int5-r3
        next: 'Short boot: see the panic/park reason'
        src: tools/read-ramdump.py
      - id: ran-900
        label: up >= 890 s (deadline)
        gated: true
        all: [{metric: uptime_s, ge: 890}]
        sample: 20261104-095002-a7-int5-r3
        next: 'Run to the 900 s deadline'
        src: docs/CPU.md
      - id: no-respawn-loop
        label: no daemon respawn loop (execs <= 3)
        gated: true
        all: [{metric: respawn_max, le: 3}]
        sample: live-20261104-014956-a7-sweep1
        next: 'Respawn loop: hk_env-inject the looping daemon; crashdoc its CRASH lines'
        src: research/ios26-userland-r1/DEBUG-TOOLS.md
        action: respawn-loops
      - id: no-codesign
        label: no CODE SIGNING kills
        gated: true
        all: [{metric: codesign, le: 0}]
        sample: 20261104-095002-a7-int5-r3
        next: 'CODE SIGNING: W^X request (glass4 backboardd) - see the process named'
        src: AGENTS.md (every boot is a debug session)
      - id: no-crash
        label: no userland crashes or usertraps
        gated: true
        all: [{metric: crashes, le: 0}, {metric: usertraps, le: 0}]
        sample: 20261104-095002-a7-int5-r3
        next: 'tools/crashdoc.py on the boot'
        src: tools/crashdoc.py
        action: crashdoc
    fails:
      - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|blazer-usbcon: the host asked to end this boot|HK GPUTA: rung \d+ PASS)(?P<why>.{0,100})', label: unplanned panic}
      - {re: 'CODE SIGNING: \d+\[(?P<proc>[^\]]+)\]', label: CODE SIGNING}
      - {re: 'usertrap: (?P<proc>[^\[\s]+)\[', min: 1, label: usertrap}
