        next: 'Reached on the phone (nfc2 code, hk_dbg bit 7): ST21NFC fw 0x02102850 hw 0x06, NCI 2.0'
        src: '/data/work/hk-nfccam/STATUS.md'
      - id: discover
        label: RF discovery accepted (RF_DISCOVER status 0)
        all: [{re: 'blazer-nfc: discovery on \(poll'}]
        sample: 20261111-215403-a7-nfccam1-a
        next: 'Reached (hk-nfccam-1: CORE_INIT re-sent after the mode-on reset): RF_DISCOVER status 0, 30 s, 0 error ntfs'
        src: '/data/work/hk-nfccam/STATUS.md'
      - id: tag
