      confirm: owner_or_screenshot
    partial:
      any:
        - {re: 'SWEET (?:HID|REMOTE): .*(?:remote|TAP|HOME)', label: planned remote event marker}
    owner: 'Did the scripted TAP land without manual recovery?'
    next: {kind: unattended, minutes: 10, test: 'int1 live session: usbcon --tap/--home loop with hk_screen=30 screenshots before and after each event'}

