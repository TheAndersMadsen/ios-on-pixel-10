        - {re: 'blazer-ecm: .*(rx|received) [1-9]', label: planned ECM traffic}
    partial:
      any:
        - {re: 'blazer-ecm: .*bound', label: planned ECM binding}
    active:
      any:
        - {re: 'blazer-netstack: IONetworkStack opened by configd'}
        - {re: 'blazer-usbnet: IONetworkStack published'}
    owner: 'Does the Mac see a USB Ethernet interface and ping the phone?'
    next: {kind: build, minutes: 10, test: 'ECM binding image; host pings the phone unattended'}

