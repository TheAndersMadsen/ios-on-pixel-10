  # ---------------------------------------------------------------- USB
  - id: fastboot-logs
    phone_only: true
    row: Fastboot and logs
    needs:
      markers: ['Booting|current-fresh']
    works:
      all:
        - {re: 'Booting\s+OKAY', src: [fastboot]}
        - {re: 'current-fresh=yes', src: [reader]}
      note: ''
    partial:
      any:
        - {re: 'Booting\s+OKAY', src: [fastboot]}
    owner: 'None'
    next: {kind: none, minutes: 0, test: 'Proved by every attempt'}

  - id: live-console
    phone_only: true
    row: Live console
    needs:
      markers: ['usbcon: connected|Tegu USB diagnostic connected']
    works:
      all:
        - {re: 'usbcon: connected: nonce', src: [console]}
        - {re: '^\d\d:\d\d:\d\d\.\d+ \[\s*\d+\.\d+\] ', src: [console], min: 1000, label: live kernel lines}
      note: ''
    partial:
      any:
        - {re: 'Tegu USB diagnostic connected', src: [live]}
        - {re: 'usbcon: connected: nonce', src: [console]}
    owner: 'None'
    next: {kind: none, minutes: 0, test: 'Proved; add a live-vs-mirror byte compare to live_boot.sh for the zero-loss claim'}

  - id: mac-link
    phone_only: true
    row: Link to the Mac
    needs:
      markers: ['lockdownd|usbmuxd|remoted']
    works:
      all:
        - {re: 'lockdownd.*[Pp]air(ing)? (complete|succeeded)', label: planned pairing marker}
    partial:
      any:
        - {re: 'usbmuxd|remoted.*(listening|connected)'}
    owner: 'Does Finder/Xcode see the phone?'
    next: {kind: build, minutes: 15, test: 'Native mux over the USB console transport; host-side pairing script can run unattended'}

  - id: usb-net
    phone_only: true
