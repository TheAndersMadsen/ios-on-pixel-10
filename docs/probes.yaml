  - id: usb-host
    phone_only: true
    row: USB host, video out
    # research/ios26-phaseb-r1/usbhost/USBHOST.md: XNU hk-usbhost1 (blazer_usbhost=1, no blazer_usbcon in that image). Result in
    # the ramdump. Video out has no driver yet: works needs the planned blazer-dp line, so the row stops at partial with host only.
    needs:
      markers: ['blazer-usbhost: ']
      boot_args: ['blazer_usbhost=1']
      image: 'a7-ios-system-usbhost1 (usbhost/tools/mkimg_usbhost.sh); owner swaps the Mac cable for a powered hub + device'
    works:
      all:
        - {re: 'blazer-usbhost: PASS, port \d+ enumerated (?P<vidpid>[0-9a-f]{4}:[0-9a-f]{4})', label: a device enumerated}
        - {re: 'blazer-dp: video out (?P<mode>\d+x\d+@\d+)', label: 'planned: DP alt mode picture (no driver yet)'}
      confirm: owner
      note: 'USB host ({vidpid}) and DP video out {mode} under iOS ({attempt})'
    partial:
      all:
        - {re: 'blazer-usbhost: ENUM port (?P<port>\d+) speed (?P<speed>\w+) dev (?P<vidpid>[0-9a-f]{4}:[0-9a-f]{4})', label: device descriptor read}
        - {re: 'blazer-usbhost: PASS, port \d+ enumerated', label: enumeration complete}
      note: 'USB host: {speed}-speed device {vidpid} enumerated on port {port} (kernel only, no iOS USB stack; no video out) ({attempt})'
    built:
      all:
        - {re: 'blazer-usbhost: host mode, GCTL [0-9a-f]+', label: DWC3 in host mode}
        - {re: 'blazer-usbhost: running, USBSTS [0-9a-f]+', label: xHCI running}
      note: 'DWC3 switched to host and the xHCI ran; no device enumerated ({attempt})'
    active:
      all:
        - {re: 'blazer-usbhost: survey GSNPSID 33313130', label: 'controller read, survey'}
      note: 'Host-mode kernel admitted and surveyed the controller ({attempt})'
    fails:
      - {re: 'blazer-usbhost: refused: (?P<why>.*)', label: refused before any write}
      - {re: 'blazer-usbhost: stop: (?P<why>(?!no device).*?), events', label: host bring-up or enumeration failed}
      - {re: 'blazer-usbhost: stop: no device', label: 'no connect on the USB2 ports (device unpowered? VBUS is not sourced by the phone)'}
    owner: 'Was the hub (with its charger) and a device plugged in within 90 s of the boot, and which device was it?'
    next: {kind: attended, minutes: 12, test: 'a7-ios-system-usbhost1: owner swaps the Mac cable for a powered USB-C hub + USB stick within 90 s, re-plugs the Mac after ~5 min for the ramdump (USBHOST.md test plan)'}

