    needs:
      markers: ['blazer-sens|SWEET SENS|blazer-chre']
      image: 'a7-ios-system-sens2 (built 85664fb3, blazer_sensors=2 + mag)'
    works:
      all:
        - {re: '(?:blazer-sens\w*|SWEET SENS\w*): .*accel', min: 10}
        - {re: '(?:blazer-sens\w*|SWEET SENS\w*): .*gyro', min: 10}
        - {re: '(?:blazer-sens\w*|SWEET SENS\w*): .*(prox|light|baro)', label: planned remaining sensors}
    partial:
