  # ---------------------------------------------------------------- Connectivity
  - id: wifi
    phone_only: true
    row: Wi-Fi
    needs:
      markers: ['blazer-wifi: ']
      image: 'hk-wifi-join kernel and a staged network'
    works:
      all:
        - {re: 'blazer-wifi: join: joined', label: 'planned: 4-way handshake done'}
        - {re: 'gateway answered a ping', label: 'planned: packet traffic'}
      note: 'Joined and the gateway answered a ping ({attempt})'
    partial:
      all:
        - {re: 'blazer-wifi: scan: ended, status 0, \d+ ms: \d+ results, (?P<networks>\d+) networks', group: networks, ge: 1}
      any:
        - {re: 'blazer-wifi: join: association: status 0'}
        - {re: 'blazer-wifi: scan: ended'}
      note: 'BCM4390 under iOS: scan found {networks} networks ({attempt})'
    fails:
      - {re: 'blazer-wifi: join: the 4-way handshake failed: status (?P<hs_status>\d+), reason (?P<hs_reason>\d+)', label: 4-way handshake failed}
      - {re: 'blazer-wifi: join: deauth by the network', label: deauthenticated}
    owner: 'Does Settings show the phone joined to the network?'
    next: {kind: unattended, minutes: 15, test: 'Boot a7-wifi-join-r4 (built 214641ba, Android .57.31 firmware + RX-ring witness); join and ping are logged'}

  - id: bluetooth
    phone_only: true
    row: Bluetooth
    needs:
      markers: ['SWEET AKS: bluetoothuserd|blazer-bt|bluetoothd']
    works:
      all:
        - {re: 'blazer-bt: .*HCI .*attached', label: 'planned: native HCI attachment'}
      confirm: owner_or_screenshot
    partial:
      any:
        - {re: 'SWEET AKS: bluetoothuserd sel \d+ .*-> 0x0', label: keychain path answered}
    owner: 'Does Settings > Bluetooth list nearby devices?'
    next: {kind: build, minutes: 15, test: 'B2/B3: bluetoothd allowed with the H4 transport; unattended boot logs HCI reset/version'}

  - id: cellular
    phone_only: true
    row: Cellular
    # S5400 modem on PCIe0. Rungs and lines: research/ios26-modem-r1/MODEM.md (hk-modem1 kernel, hk_dbg bits 24..27 = stage).
    needs:
      markers: ['blazer-modem: |cell: ']
      image: 'hk-modem1 kernel (research/ios26-modem-r1/PHONE-TEST.md): hk_dbg | 0x04000000 for stage 4'
    works:
      all:
        - {re: 'cell: the data session is up', label: 'planned (rung 10): packet service'}
        - {re: 'cell: registered (?P<rat>\S+)', label: 'planned (rung 9): network registration'}
      confirm: owner
      note: 'Registered on {rat}, data session up ({attempt})'
    partial:
      all:
        - {re: 'blazer-modem: cp: ONLINE', label: 'planned (rung 7): CP firmware booted, INIT_END sent'}
      note: 'S5400 firmware booted under iOS ({attempt})'
    built:
      all:
        - {re: 'blazer-modem: rom: boot_stage 0x(?P<boot_stage>[0-9a-f]+)', label: 'planned (rung 5): CP ROM boot handshake'}
      note: 'CP ROM handshake, boot_stage 0x{boot_stage} ({attempt})'
    active:
      all:
        - {re: 'blazer-modem: verdict: PASS stage 4, at id: PCIe0 link gen (?P<gen>\d) x(?P<width>\d+), endpoint 144d:(?P<dev>[0-9a-f]{4})', label: 'S5400 boot ROM linked on PCIe0, config ID read'}
      any:
        - {re: 'blazer-modem: id: 144d:a5a5 class 0x028000', label: 'the ID Android reads (144d:a5a5)'}
        - {re: 'blazer-modem: link: UP, attempt \d+'}
      note: 'S5400 boot ROM on PCIe0 under iOS: gen {gen} x{width}, 144d:{dev}, no firmware ({attempt})'
    fails:
      - {re: 'blazer-modem: verdict: STOP stage (?P<stage>\d), at (?P<at>\S+): (?P<why>[^,]+), detail 0x(?P<detail>[0-9a-f]+)', label: modem rung stopped}
      - {re: 'blazer-modem: read: CP as found: NOT off', label: CP not off as found (stage 4 refuses)}
      - {re: 'blazer-modem: link: attempt 4 failed', label: CP ROM never trained}
      - {re: 'blazer-modem: tidy: .*errors 0x[1-9a-f]', label: tidy could not restore a pad}
    owner: 'Does the status bar show a carrier?'
    next: {kind: unattended, minutes: 15, test: 'research/ios26-modem-r1/PHONE-TEST.md: the int3/obs image on hk-modem1 with hk_dbg | 0x04000000 (stage 4); verdict line + return check'}

  - id: sim
    phone_only: true
    row: SIM, eSIM
    # Read by the CP firmware only (Dual SIM detect = 2 on Android); the AP sees it through RIL IPC. Needs Cellular rung 9.
    needs:
      markers: ['blazer-modem: |cell: ']
    works:
      all:
        - {re: 'cell: SIM ready', label: 'planned (rung 9): SIM status over umts_ipc0'}
      confirm: owner
    partial:
      any:
        - {re: 'cell: SIM (?P<sim>ready|absent|locked|error)', label: 'planned (rung 9): SIM status answered'}
      note: 'CP reports SIM {sim} ({attempt})'
    owner: 'Does Settings > Cellular show the SIM (carrier name)?'
    next: {kind: build, minutes: 15, test: 'Blocked on Cellular rungs 5..9 (CP firmware boot, RFS, RIL): research/ios26-modem-r1/MODEM.md section 6'}

  - id: gps
    phone_only: true
    row: GPS
    # Samsung KEPLER GNSS: SPI (lsios_cli6_spi) for IPC, firmware loaded through the CP (gnss_boot into GNSS_FW). Needs the CP running.
    needs:
      markers: ['blazer-gnss: |gnss: ']
    works:
      all:
        - {re: 'gnss: fix', label: 'planned (G2): a position fix'}
      confirm: owner
    partial:
      any:
        - {re: 'blazer-gnss: KEPLER ready', label: 'planned (G1): GNSS firmware up, SPI link'}
    owner: 'Does Maps show the position?'
    next: {kind: build, minutes: 15, test: 'Blocked on Cellular rung 7 (CP online), then G1: research/ios26-modem-r1/MODEM.md section 6'}

  - id: nfc
    phone_only: true
    row: NFC
    needs:
      boot_args: ['blazer_nfc=[1-4]']
      markers: ['blazer-nfc: ']
      image: 'hk-nfc1 kernel (research/ios26-nfc-r1/DESIGN.md), e.g. a7-ios-system-nfc1'
    works:
      all:
        - {re: 'blazer-nfc: tag: (?P<tech>nfc-[abfv]|other), protocol 0x[0-9a-f]+, id (?P<tag_id>[0-9a-f]+)', label: 'a tag read by RF discovery'}
        - {re: 'blazer-nfc: ends: ok, stage 4'}
      note: 'Kernel driver reads tags: {tech} id {tag_id} ({attempt}); no iOS NFC service'
    partial:
      all:
        - {re: 'blazer-nfc: chip st21nfc fw 0x(?P<fw>[0-9a-f]{8}) hw 0x(?P<hw>[0-9a-f]{2})', label: 'ST21NFC identified (power-up CORE_RESET_NTF)'}
      any:
        - {re: 'blazer-nfc: nci init ok'}
        - {re: 'blazer-nfc: address 0x08 acked, power-up reset ntf received'}
      note: 'ST21NFC powered and identified in the kernel: fw 0x{fw} hw 0x{hw} ({attempt})'
    fails:
      - {re: 'blazer-nfc: address 0x08 never acked', label: 'controller never answered (enable polarity, mux or clock)'}
      - {re: 'blazer-nfc: chip in loader mode', label: 'controller in loader mode'}
      - {re: 'blazer-nfc: core generic error ntf, status 0x(?P<nci_err>[0-9a-f]+)', label: 'NCI generic error (RF config/clock)'}
      - {re: 'blazer-nfc: ends: (?!ok)(?P<nfc_stop>[a-z-]+), stage', label: 'driver stopped'}
    owner: 'Was an NFC card held on the back of the phone during the 30 s window?'
    next: {kind: unattended, minutes: 15, test: 'Boot a7-ios-system-nfc1 (obs1 + blazer_nfc=4 blazer_nfc_wait=30): identify line unattended; a tag line if the owner holds a card at ~60-90 s'}

  - id: uwb
    phone_only: true
    row: UWB
    owner: 'Not assigned; presence unconfirmed'
    next: {kind: none, minutes: 0, test: 'Not assigned'}

