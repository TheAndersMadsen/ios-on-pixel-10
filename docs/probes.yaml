# Evidence probes: one entry per README feature row (docs/status.json "features").
#
# tools/probe_eval.py reads this file, runs every probe over one or more boot
# attempts (fastboot attempt directories, live-console directories or plain log
# files) and prints a per-row verdict with file:line evidence. --propose-status
# compares the verdicts with docs/status.json; --apply writes the proposal.
#
# Sources searched (an attempt directory may hold several):
#   msgbuf   ramdump/kernel.log, XNU-MSGBUF mirror (current boot only: counted when
#            reader.txt says current-fresh=yes, see tools/read-ramdump.py)
#   live     live.log (shim USB diagnostic console)
#   console  console.txt (tools/live_boot.sh live console)
#   reader   reader.txt (tools/read-ramdump.py verdict and milestones)
#   fastboot boot.log, capture.log
#   abl      ramdump/abl.log.txt (bootloader log; Android residue possible)
#
# Probe fields:
#   id       short slug; row: the exact status.json feature name
#   phone_only  true when QEMU cannot exercise the row (tools/qemu_preflight.py skips it;
#            probe_eval.py --qemu does the same)
#   milestone   true for probes that are not README rows (Home, app launches); never
#            compared with status.json
#   needs    what an image must contain for the probe to say anything:
#              boot_args: regexes matched against launchd's "boot-args =" line
#              markers:   regexes; at least one must appear, or the row is
#                         "not exercised" in that attempt (never a failure)
#              image:     free text for the image builder (not machine checked)
#   works / partial / built / active
#            a level is proved in an attempt when every "all" check passes and,
#            if given, at least one "any" check passes. confirm: owner|screenshot|
#            owner_or_screenshot means the log alone stops one level lower until a
#            confirmation line exists (docs/owner_confirmations.txt or the attempt's
#            confirm.txt). note: template for the proposed status note ({group}
#            names come from the checks' named regex groups, {attempt} = run name).
#   fails    checks that prove a named failure (the ❌ evidence). They never
#            demote a row; they are reported as blockers.
#   screenshot  optional automatic check on screen*.png (nonblack = mean luma above
#            the threshold); content (e.g. the battery percentage) needs review.
#   owner    the question to ask when no log proof exists.
#   next     the cheapest unattended test that moves the row forward:
#            kind unattended|attended|build|none, minutes of phone time, test.
#
# Check fields: re (Python regex, one line), min (default 1), max, src (list),
#   group + distinct_min / span_min / ge / le (numeric tests on a named group),
#   seq (regexes that must appear in that order), label.
# Patterns come from the 2026-11-03 boot dumps (research/laguna-usb-fix/attempts/
# 20261103-*); a pattern marked "planned" is not printed by any kernel yet.

version: 1

common:
  # A panic that is not the planned end of a boot (deadline, or a GPU rung ending on purpose).
  unplanned_panic: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)'
  deadline: 'blazer-root: deadline (?P<deadline>\d+) s, stage'

probes:
  # ---------------------------------------------------------------- CPU
  - id: a725-cores
    phone_only: true
    row: 5 A725 cores
    needs:
      markers: ['SWEET CPU: \d+/\d+ CPUs initialized']
      boot_args: ['cpus=5']
    works:
      all:
        - {re: 'SWEET CPU: (?P<cpus>5)/5 CPUs initialized', label: five cores up}
        - {re: 'blazer-root: deadline (?P<deadline>\d+) s, stage', group: deadline, ge: 900, label: ran 15 min}
        - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)', min: 0, max: 0, label: no unplanned panic}
      note: 'Ran {deadline} s under iOS on 5 cores, no kernel crash ({attempt})'
    partial:
      all:
        - {re: 'SWEET CPU: 5/5 CPUs initialized'}
    fails:
      - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)', label: unplanned panic}
    owner: 'Did the phone stay up for the whole run with five cores?'
    next: {kind: none, minutes: 0, test: 'Proved by every 900 s boot; keep as regression probe'}

  - id: cpu-clock
    phone_only: true
    row: CPU clock control
    needs:
      markers: ['blazer-gov: running']
    works:
      all:
        - {re: 'blazer-gov: running, (?P<cores>\d+) cores'}
        - {re: 'blazer-gov: write domain \d+ level \d+, (?P<mhz>\d+) MHz', group: mhz, distinct_min: 3, label: three or more clock levels}
        - {re: 'blazer-clock: cpu \d+ mpidr \S+ level \d+ want \d+ cycles \d+ ticks \d+ mhz \d+', min: 50, label: 'clock reads (85-87 per 900 s boot)'}
        - {re: 'blazer-root: deadline (?P<deadline>\d+) s, stage', group: deadline, ge: 900}
      note: 'Governor ran {deadline} s under iOS, clock levels up to {mhz} MHz on demand ({attempt})'
    partial:
      all:
        - {re: 'blazer-gov: write domain \d+ level \d+, \d+ MHz'}
    owner: 'None needed: the clock reads are the proof'
    next: {kind: none, minutes: 0, test: 'Proved; keep as regression probe'}

  - id: cpu-high-clock
    phone_only: true
    row: Higher clocks, up to the 3052 MHz top
    needs:
      markers: ['blazer-gov: running']
      image: 'governor cap above level 16 (1075 MHz) and the health checker admitted'
    works:
      all:
        - {re: 'blazer-gov: write domain \d+ level \d+, (?P<mhz>\d+) MHz', group: mhz, ge: 2500, label: '>= 2500 MHz written'}
        - {re: 'blazer-root: deadline (?P<deadline>\d+) s, stage', group: deadline, ge: 900}
        - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)', min: 0, max: 0}
      note: 'Up to {mhz} MHz sustained {deadline} s under iOS ({attempt})'
    partial:
      all:
        - {re: 'blazer-gov: write domain \d+ level \d+, (?P<mhz>\d+) MHz', group: mhz, ge: 1075}
    owner: 'None: needs a boot with a higher governor cap'
    next: {kind: build, minutes: 18, test: 'Build int1 with gov cap above level 16 after checker admission; one unattended 900 s boot, thermal guard on'}

  # Topology (research/ios26-dualboot-r8/truth/fdt.dts): one DSU cluster, PSCI for all eight. A520 "hayes" MPIDR 0x0
  # and 0x100, A725 "hunter" 0x200-0x600, X4 "hunterELP" 0x700. SweetCPU prints MPIDRs with %x: 0x0, 0x100, 0x700.
  # cpu0 (0x0) runs the shim and stays parked in it under blazer_bootcpu, so PSCI calls it ON: CPU_ON rc=-4.
  # Why only five today and what each step needs: research/ios26-cpu-smp-r1/SMP.md.
  - id: a520-cores
    phone_only: true
    row: 2 A520 cores
    needs:
      markers: ['SWEET CPU: requested=']
      boot_args: ['cpus=[78]|blazer_cpu0_audit=2']   # 7-8 cores, or the read-only Errata ABI query image
    works:
      all:
        - {re: 'SWEET CPU: (?P<cpus>[78])/[78] CPUs initialized, SGI1 verified', label: seven or eight cores up}
        - {re: 'SWEET CPU: cpu=\d+ mpidr=0x0 came alive; SGI1 OK', label: A520 cpu0 (0x0) alive under XNU}
        - {re: 'SWEET CPU: cpu=\d+ mpidr=0x100 came alive; SGI1 OK', label: A520 cpu1 (0x100) alive under XNU}
        - {re: 'blazer-root: deadline (?P<deadline>\d+) s, stage', group: deadline, ge: 900}
        - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)', min: 0, max: 0}
      note: '{cpus} cores incl. both A520s ran {deadline} s under iOS ({attempt})'
    partial:
      any:
        - {re: 'SWEET CPU: cpu=\d+ mpidr=0x(?:0|100) came alive; SGI1 OK', label: an A520 came alive}
    active:
      # blazer_cpu0_audit=2 image: the firmware's own Errata ABI answer for the CAS erratum on cpu0 (read only).
      all:
        - {re: 'cpu0-em-erratum\s+DONE\s+0x\S+\s+\S+\s+\(erratum 3685825: \S+\)', src: [reader], label: firmware answered for erratum 3685825}
    fails:
      - {re: 'SWEET CPU: cpu=\d+ mpidr=0x(?:0|100) NOT alive', label: an A520 did not start}
      - {re: 'SWEET CPU: cpu=\d+ NOT alive: PSCI CPU_ON rc=-4', label: 'CPU_ON ALREADY_ON (cpu0 is parked in the shim)'}
    owner: 'None for the query image; any A520 CPU_ON needs the owner decision in research/ios26-cpu-smp-r1/SMP.md'
    next: {kind: unattended, minutes: 8, test: 'a7-cpu0-em-r1 (blazer_cpu0_audit=2, 300 s, five A725s): read the Errata ABI answers in stamps-decode.txt'}

  - id: x4-core
    phone_only: true
    row: X4 core
    needs:
      markers: ['SWEET CPU: requested=']
      boot_args: ['cpus=[678]']
    works:
      all:
        - {re: 'SWEET CPU: (?P<cpus>[678])/[678] CPUs initialized, SGI1 verified'}
        - {re: 'SWEET CPU: cpu=\d+ mpidr=0x700 came alive; SGI1 OK', label: X4 (0x700) alive under XNU}
        - {re: 'blazer-root: deadline (?P<deadline>\d+) s, stage', group: deadline, ge: 900}
        - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)', min: 0, max: 0}
      note: 'X4 ran {deadline} s under iOS with {cpus} cores ({attempt})'
    partial:
      all:
        - {re: 'SWEET CPU: cpu=\d+ mpidr=0x700 came alive; SGI1 OK', label: X4 came alive}
    fails:
      - {re: 'SWEET CPU: cpu=\d+ mpidr=0x700 NOT alive', label: X4 did not start}
    owner: 'Out of reach for now: X4 errata 3076789, 2957258, 4118414 not fixed; image_tool refuses core 7 (research/ios26-cpu-smp-r1/SMP.md)'
    next: {kind: none, minutes: 0, test: 'No test until the X4 errata are answered (an Errata ABI query must run on the X4 itself)'}

  - id: idle-sleep
    phone_only: true
    row: Idle sleep
    owner: 'Code-reading claim (WFI idle); no log marker exists'
    next: {kind: build, minutes: 18, test: 'Add a per-core WFI residency counter to the blazer-gov tick line; any unattended boot then proves it'}

  # ---------------------------------------------------------------- Memory
  - id: mem-clocks
    phone_only: true
    row: Memory and shared cluster clocks
    needs:
      markers: ['blazer-gov: write dsu level']
    works:
      all:
        - {re: 'blazer-gov: write dsu level (?P<dsu>\d+)'}
        - {re: 'blazer-gov: t=\d+ .* dsu (?P<dsu_now>\d+) gmc (?P<gmc>\d+) memss (?P<memss>\d+)', min: 2}
        - {re: 'blazer-root: deadline (?P<deadline>\d+) s, stage', group: deadline, ge: 900}
      note: 'DSU/GMC/MEMSS raised under iOS for {deadline} s ({attempt})'
    partial:
      all:
        - {re: 'blazer-gov: write dsu level \d+'}
    owner: 'None'
    next: {kind: none, minutes: 0, test: 'Proved; keep as regression probe'}

  - id: ram
    phone_only: true
    row: RAM
    needs:
      markers: ['blazer-mem: window']
    works:
      all:
        - {re: 'blazer-mem: window 0x[0-9a-f]+ \+ (?P<window>0x[0-9a-f]+)', label: memory window}
        - {re: 'blazer-root: deadline (?P<deadline>\d+) s, stage', group: deadline, ge: 900}
        - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)', min: 0, max: 0}
      note: 'Window {window} under iOS for {deadline} s ({attempt})'
    partial:
      all:
        - {re: 'blazer-mem: window'}
    owner: 'None'
    next: {kind: none, minutes: 0, test: 'Proved; keep as regression probe'}

  - id: ram-rest
    phone_only: true
    row: The rest of the 16 GiB
    # blazer_mem=14..16 (XNU hk-ram-full, research/ios26-ram-r1/RAM.md): the high bank up to the MTE tag base
    # (0x35ef80000 = 13.48 GiB managed) and hw.memsize = the installed 16 GiB. The low bank's 2 GiB (DT carve-outs,
    # shim, ABL) and the 496 MiB from the tag base up are never managed: this is the whole of what can be.
    needs:
      markers: ['blazer-mem: window']
    works:
      all:
        - {re: 'blazer-mem: window 0x882000000 \+ (?P<window>0x35ef80000), was \+ 0x[0-9a-f]+, hw.memsize 0x400000000', label: full map}
        - {re: 'blazer-mem: vm max_mem (?P<max_mem>0x35ef80000), hw.memsize (?P<memsize>0x400000000)', label: VM readback}
        - {re: 'blazer-root: deadline (?P<deadline>\d+) s, stage', group: deadline, ge: 900}
        - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)', min: 0, max: 0}
      note: 'Window {window} managed, hw.memsize {memsize} under iOS for {deadline} s ({attempt})'
    partial:
      all:
        - {re: 'blazer-mem: full map, installed 0x400000000', label: full map applied}
    owner: 'None'
    next: {kind: unattended, minutes: 25, test: 'a7-ios-system-ramfull (int1 + blazer_mem=16), unattended 900 s boot; then a blazer_mem_test=4096 boot'}

  # ---------------------------------------------------------------- Display
  - id: picture
    phone_only: true
    row: Full 1280x2856 picture
    needs:
      markers: ['tensor-dpu: scale attached']
    works:
      all:
        - {re: 'tensor-dpu: scale attached: source (?P<src>\d+x\d+) to \d+,\d+ (?P<dst>1280x2856)'}
        - {re: 'tensor-dpu: frames kicks \d+ dones (?P<dones>[1-9]\d*)', label: frames completed}
      note: 'Scaled from {src} to {dst}, frames completed ({attempt})'
    partial:
      all:
        - {re: 'tensor-dpu: attached: layer'}
    screenshot: {file: 'screen*.png', check: nonblack, expect: 'Home or boot picture, not black'}
    owner: 'Does the panel show a full-screen picture?'
    next: {kind: none, minutes: 0, test: 'Proved; hk_screen=30 screenshots keep it checked unattended'}

  - id: hz120
    phone_only: true
    row: 120 Hz
    needs:
      markers: ['SWEET FB: refresh asked']
    works:
      all:
        - {re: 'SWEET FB: rate swaps (?P<swaps>[\d.]+)/s', group: swaps, ge: 100, label: '>= 100 completed swaps/s'}
        - {re: 'SWEET FB: refresh asked 120, running 120'}
      note: 'Measured {swaps} swaps/s at 120 Hz ({attempt})'
    partial:
      any:
        - {re: 'SWEET FB: refresh asked \d+, running 120'}
    owner: 'None: the swap-rate line measures it'
    next: {kind: build, minutes: 10, test: 'int1 image with the panel profile at 120 Hz; unattended 300 s boot reads SWEET FB rate'}

  - id: hz60
    phone_only: true
    row: 60 Hz mode and frame sync
    needs:
      markers: ['SWEET FB: refresh asked']
    works:
      all:
        - {re: 'SWEET FB: refresh asked 60, running 60'}
        - {re: 'SWEET FB: rate swaps (?P<swaps>[\d.]+)/s', group: swaps, ge: 55, label: '>= 55 completed swaps/s'}
      note: '60 Hz: {swaps} completed swaps/s ({attempt})'
    partial:
      all:
        - {re: 'SWEET FB: refresh asked 60, running 60'}
        - {re: 'tensor-dpu: frames kicks \d+ dones [1-9]\d*'}
        - {re: 'SWEET FB: rate swaps (?P<swaps>[\d.]+)/s', group: swaps, ge: 1, label: measured swap rate}
      note: '60 Hz panel mode; completed frames measured at up to {swaps} swaps/s ({attempt})'
    fails:
      - {re: 'tensor-dpu: underrun in frame \d+', min: 10, label: DPU underruns}
    owner: 'None'
    next: {kind: unattended, minutes: 10, test: 'Re-run int1 300 s with a scripted swipe loop (usbcon --tap) and read the SWEET FB rate lines'}

  - id: vrr
    phone_only: true
    row: Variable refresh down to low rates
    needs:
      markers: ['SWEET FB: refresh asked']
    partial:
      all:
        - {re: 'SWEET FB: refresh asked (?P<hz>\d+), running (?P<run>\d+)', group: run, le: 30, label: running at 30 Hz or lower}
    owner: 'None'
    next: {kind: build, minutes: 10, test: 'Idle-rate build not written; then one unattended idle boot'}

  - id: brightness
    phone_only: true
    row: Brightness
    needs:
      markers: ['SWEET BL: AppleARMBacklight published']
    works:
      all:
        - {re: 'SWEET BL: request backboardd route (?:IOMFBBrightnessLevel|brightness-nits) raw \d+ rc 0 \(queued for DCS\)', min: 2, label: requests queued for DCS}
        - {re: 'tensor-dpu: bright transport sent_dbv (?P<dbv>\d+) .*rc 0', group: dbv, span_min: 1000, label: 'SWEET BL sends across the range'}
      confirm: owner_or_screenshot
      note: 'Slider requests reach the panel: DBV {dbv} sent over DCS ({attempt})'
    partial:
      all:
        - {re: 'SWEET BL: request backboardd route (?:IOMFBBrightnessLevel|brightness-nits) raw \d+ rc 0', label: requests reach the kernel}
    fails:
      - {re: 'SWEET BL: request backboardd route \S+ raw \d+ rc 0x[0-9a-f]+ \(refused\)', min: 1, label: refused requests}
      - {re: 'tensor-dpu: bright transport .*\(no panel readback\)', label: no panel readback (log cannot see the panel)}
    owner: 'Does moving the Settings slider visibly change the panel brightness?'
    next: {kind: unattended, minutes: 10, test: 'Scripted slider sweep (usbcon --tap on Control Center) with a DCS brightness readback (0x52) logged per send'}

  - id: hdr
    phone_only: true
    row: HDR, peak brightness, colour calibration
    owner: 'Not assigned'
    next: {kind: none, minutes: 0, test: 'Not assigned'}

  - id: aod
    phone_only: true
    row: Always-on display, self-refresh
    owner: 'Not assigned'
    next: {kind: none, minutes: 0, test: 'Not assigned'}

  # ---------------------------------------------------------------- Graphics
  - id: gpu-id
    phone_only: true
    row: GPU power-on and ID
    needs:
      markers: ['blazer-gpu: ']
    works:
      all:
        - {re: 'blazer-gpu: reg CORE_ID \+0x20 (?P<core_id>0x[0-9a-f]+)'}
        - {re: 'blazer-gpu: vote \d+ reply'}
      note: 'GPU answers: core id {core_id} read from XNU ({attempt})'
    partial:
      all:
        - {re: 'blazer-gpu: vote \d+ reply'}
    owner: 'None'
    next: {kind: none, minutes: 0, test: 'Proved; keep as regression probe'}

  - id: gpu-firmware
    phone_only: true
    row: GPU firmware through Trusty
    needs:
      markers: ['HK GPUTA: ']
    works:
      all:
        - {re: 'HK GPUTA: rung (?P<rung>\d+) PASS, firmware running', group: rung, ge: 6, label: firmware running (rung 6 health)}
      note: 'Firmware health rung {rung} PASS ({attempt})'
    partial:
      any:
        - {re: 'HK GPUTA: SEND_FIRMWARE_IMAGE .* result 0'}
        - {re: 'HK GPUTA: SMC START'}
        - {re: 'HK GPUTA: tipc online'}
    fails:
      - {re: 'HK GPUTA: TA\| gpu-secure-trusty: \d+: process_st_info\(\) failed', label: process_st_info failed}
      - {re: 'HK GPUTA: TA\| gpu-secure-trusty: \d+: RGXValidateFWHeaderVersion2: KM and FW version mismatch', label: KM/FW version mismatch}
    owner: 'None'
    next: {kind: build, minutes: 5, test: 'GPU M3: first real command stream; unattended rung-7 boot that ends on purpose'}

  - id: metal
    phone_only: true
    row: Metal drawing
    needs:
      markers: ['HK GPUTA: |HKACCEL: ']
    works:
      all:
        - {re: 'HK GPUTA: command stream \d+ (done|complete)', label: 'planned: native command stream completed'}
        - {re: 'tensor-dpu: frames kicks \d+ dones [1-9]\d*'}
      confirm: owner_or_screenshot
    partial:
      all:
        - {re: 'HK GPUTA: command stream \d+ (done|complete)', label: planned}
    active:
      any:
        - {re: 'HK GPUTA: rung \d+ PASS'}
    owner: 'Does an app draw with Metal (not the CPU path)?'
    next: {kind: build, minutes: 5, test: 'Same as GPU M3: first native command stream'}

  - id: video
    phone_only: true
    row: Video encode and decode
    owner: 'Not assigned'
    next: {kind: none, minutes: 0, test: 'Not assigned'}

  # ---------------------------------------------------------------- Storage
  - id: ufs-read
    phone_only: false
    row: Reading
    needs:
      markers: ['blazer-ufs: ']
    works:
      all:
        - {re: 'blazer-ufs: "ios_system" on LUN \d+'}
        - {re: 'blazer-root: watch t \d+ ms stage \S+ reads (?P<reads>\d+) blocks (?P<blocks>\d+)', group: reads, ge: 1000}
        - {re: 'blazer-ufs: .*(error|timeout|fatal)', min: 0, max: 0, label: no UFS errors}
      note: 'Multi-block reads: {reads} reads, {blocks} blocks, 0 errors ({attempt})'
    partial:
      all:
        - {re: 'blazer-ufs: "ios_system" on LUN \d+'}
    fails:
      - {re: 'blazer-ufs: .*(error|timeout|fatal)', label: UFS error}
    owner: 'None'
    next: {kind: none, minutes: 0, test: 'Proved; keep as regression probe'}

  - id: ufs-write
    phone_only: false
    row: Writing (persistent /var)
    needs:
      markers: ['blazer-persist: ']
      boot_args: ['blazer_persist=1']
      image: 'a7-ios-system-int1-persist (built 84f993b6, not booted)'
    works:
      all:
        - {re: 'blazer-persist: ios_data at LBA (?P<lba>\d+)'}
        - {re: 'blazer-persist: .*sav(e|ed)', min: 2, label: saves}
        - {re: 'blazer-persist: .*restor', label: 'restore after reset (second boot)'}
      note: 'ios_data at LBA {lba}: saves and restore across a reset ({attempt})'
    partial:
      all:
        - {re: 'blazer-persist: ios_data at LBA (?P<lba>\d+)'}
    fails:
      - {re: 'blazer-persist: refused', label: writer refused}
    owner: 'Does a changed setting survive a reboot?'
    next: {kind: unattended, minutes: 25, test: 'Boot a7-ios-system-int1-persist twice (900 s, then 300 s): the second boot must log the restore (image built, image_tool gate pending commit)'}

  - id: ufs-speed
    phone_only: true
    row: Maximum speed
    needs:
      markers: ['blazer-root: stage t ']
    partial:
      all:
        - {re: 'blazer-(?:root|ufs): .*(?P<mbps>\d+(?:\.\d+)?) MB/s', label: 'planned: throughput line'}
    active:
      all:
        - {re: 'blazer-root: stage t (?P<ms>\d+) ms stage mounted reads \d+ blocks (?P<blocks>\d+) busy (?P<busy>\d+) ms'}
    owner: 'None: needs a throughput line'
    next: {kind: build, minutes: 5, test: 'Print MB/s per stage from blazer-root (blocks*4 KiB/busy) and compare against the Android baseline; any unattended boot'}

  - id: chooser
    phone_only: true
    row: Android/iOS boot chooser
    needs:
      markers: ['TGL CHOOSER|chooser', 'Darwin Kernel Version']
    works:
      all:
        - {re: 'Darwin Kernel Version', src: [msgbuf]}
      confirm: owner
      note: 'iOS from a cold power-on through the installed menu ({attempt})'
    partial:
      any:
        - {re: 'Darwin Kernel Version', src: [msgbuf]}
    owner: 'From a cold power-on, does the installed menu boot iOS and Android?'
    next: {kind: attended, minutes: 5, test: 'Cold power-on through the installed menu needs hands on the phone; the chooser stamps (tools/chooser_stamps.py) are the log side'}

  - id: partitions
    phone_only: false
    row: Isolated iOS partitions
    needs:
      markers: ['blazer-ufs: "ios_system"']
    works:
      all:
        - {re: 'blazer-ufs: "ios_system" on LUN \d+: first block \S+, (?P<mib>\d+) MiB, read only', group: mib, ge: 24576}
        - {re: 'hfs: mounted iOSRoot on device'}
      note: 'ios_system ({mib} MiB) mounted as the root ({attempt})'
    partial:
      all:
        - {re: 'blazer-ufs: "ios_system" on LUN \d+'}
