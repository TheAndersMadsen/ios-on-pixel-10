        - {re: 'SWEET PHYSICAL: .*usage=0xea down clients=[1-9]', label: Vol Down to an iOS client}
      note: 'Vol Up/Down (usage 0xe9/0xea) delivered to iOS HID clients ({attempt})'
    partial:
