  - id: battery
    phone_only: true
    row: Battery gauge
    needs:
      markers: ['blazer-battery: |HKBATT: ']
    works:
      all:
        - {re: 'HKBATT: event=battery_view_set .*value=(?P<view>[0-9.]+) .*percent=(?P<percent>\d+)', label: SpringBoard battery view value set}
        - {re: 'blazer-battery: sample \d+ SOC\((?P<soc>\d+)\)', label: gauge sample}
      confirm: owner_or_screenshot
      note: '{percent}% set on the SpringBoard battery view from the gauge ({soc}%) ({attempt})'
    partial:
      all:
        - {re: 'blazer-battery: sample \d+ SOC\((?P<soc>\d+)\), VCELL\((?P<mv>\d+)\)'}
      any:
        - {re: 'HKBATT: event=powerd_percent_post pid=\d+ rc=0'}
        - {re: 'HKBATT: event=battery_view_set'}
      note: 'Gauge {soc}% / {mv} mV reaches powerd ({attempt})'
    screenshot: {file: 'screen*.png', check: nonblack, expect: 'status bar shows the battery percentage'}
    owner: 'Is the battery percentage shown in the status bar?'
    next: {kind: unattended, minutes: 10, test: 'int1 with hk_screen=30: fb_png screenshot of the status bar; compare against the HKBATT percent'}

  # Charger: max77779chrg on SPMI SID 3 (spmi@53f1000), read by blazer_gauge.c. blazer_battery_chg=2 (XNU hk-chg1) prints one
  # report-only line per gauge sample; nothing is written. research/ios26-phaseb-r1/chg/PLAN.md, REGISTERS.md, CONTROL.md.
  - id: charging
    phone_only: true
    row: Charging control
    needs:
      boot_args: ['blazer_battery_chg=2']
      markers: ['blazer-battery: charger ']
    works:
      # planned (CONTROL.md): a limit-only CHGCC write, owner approval required; no kernel prints this yet
      all:
        - {re: 'blazer-charge: limit applied cc=(?P<cc>\d+) mA readback (?P<rb>\d+) mA', label: planned limit write read back}
      confirm: owner
      note: 'Charge current limited to {cc} mA under iOS, read back {rb} mA ({attempt})'
    partial:
      all:
        - {re: 'blazer-battery: charger \d+ in=(?P<in>usb|both|wireless|none) chg=(?P<chg>[a-z0-9-]+) mode=(?P<mode>[0-9a-f]) cp=\d wdt=(?P<wdt>\d) cc=(?P<cc>\d+) mA cv=(?P<cv>\d+) mV icl=(?P<icl>\d+) mA', min: 2, label: charger state and programmed limits read}
      note: 'Charger read under iOS (read only): in={in}, chg={chg}, mode {mode}, CC {cc} mA, CV {cv} mV, input limit {icl} mA, watchdog {wdt} ({attempt})'
    active:
      all:
        - {re: 'blazer-battery: mapping 0x53f1000 size 0x300, mode 1, charger reads report only', label: report-only reader armed}
    fails:
      - {re: 'blazer-battery: charger report \d+ unread', label: charger frame failed}
      - {re: 'blazer-battery: leaving the controller alone from here on', label: SPMI controller given up (gauge too)}
      - {re: 'blazer-battery: charger \d+ CHG_CV_PRM [0-9a-f]+ has no voltage', label: CV code outside the vendor table}
    owner: 'Was the phone on the USB cable for the whole boot? (expect in=usb)'
    next: {kind: unattended, minutes: 15, test: 'Boot a7-ios-system-chg1 (hk-chg1, built, not booted): blazer-battery: charger lines with in=usb and the ABL limits; read only'}

  # Wireless: the CPS4041 receiver sits on the max77779's own I2C master (SPMI SID 2, i2c 0x30), not on an AP I2C bus; the
  # charger's WCIN input (DETAILS_00 WCIN_DTLS, WCIN ADCs) shows a pad without touching the receiver.
  - id: wireless-charging
    phone_only: true
    row: Wireless charging
    needs:
      boot_args: ['blazer_battery_chg=2']
      markers: ['blazer-battery: charger \d+ in=']
    works:
      all:
        - {re: 'blazer-battery: charger \d+ in=wireless chg=(?:cc|cv|topoff) .* iwcin=(?P<iwcin>\d+) mA vwcin=(?P<vwcin>\d+) mV', group: iwcin, ge: 50, min: 2, label: charging from WCIN}
      confirm: owner
      note: 'Wireless charging under iOS: up to {iwcin} mA at {vwcin} mV from the pad ({attempt})'
    partial:
      all:
        - {re: 'blazer-battery: charger \d+ in=(?P<in>wireless|both) chg=(?P<chg>[a-z0-9-]+) .* vwcin=(?P<vwcin>\d+) mV', label: wireless input detected}
      note: 'Wireless pad detected under iOS (in={in}, chg={chg}, {vwcin} mV) ({attempt})'
    owner: 'Was the phone on a Qi pad, USB unplugged, for 3 minutes during the boot?'
    next: {kind: attended, minutes: 20, test: 'a7-ios-system-chg1: owner puts the phone on a Qi pad, unplugs USB ~3 min, replugs before the deadline; ramdump charger lines (PLAN.md W1)'}

  - id: rtc
    phone_only: true
    row: Real date and time
    needs:
      markers: ['blazer-rtc: ']
    works:
      all:
        - {re: 'blazer-rtc: publish want \d+ calendar \d+ .*ok 1'}
      confirm: owner_or_screenshot
      note: 'RTC time published and shown ({attempt})'
    partial:
      all:
        - {re: 'blazer-rtc: read \d+ s since \d+, unix \d+, (?P<utc>[\d-]+ [\d:]+) UTC'}
      note: 'RTC read {utc} UTC ({attempt})'
    fails:
      - {re: 'blazer-rtc: refused', label: RTC value refused}
    screenshot: {file: 'screen*.png', check: nonblack, expect: 'status bar clock matches the RTC line'}
    owner: 'Is the correct local time shown?'
    next: {kind: unattended, minutes: 10, test: 'int1 with hk_screen=30: status-bar clock in the fb_png screenshot vs the blazer-rtc line'}

  # ---------------------------------------------------------------- Cameras, Security, Apple services
  # research/ios26-camera-r1/CAMERA.md (hk-cam1). Flash = TI LM3644 on CLI7 (i2c@3a301000, 0x63). The flash alone never makes
  # this row "works": that needs a camera sensor (camera-sensor below) and a capture path.
  - id: cameras
    phone_only: true
    row: Cameras, flash
    needs:
      markers: ['blazer-torch: ']
      boot_args: ['blazer_torch=[1-4]']
      image: 'a7-ios-system-cam1 (kernel.cam1 c4c47954, r3 line + blazer_torch=4)'
    partial:
      all:
        - {re: 'blazer-torch: led1 off: standby, (?P<ms>\d+) ms lit, flags 0x0 0x0', label: 'LED1 torch lit and back to standby, no fault'}
        - {re: 'blazer-torch: led2 off: standby, \d+ ms lit, flags 0x0 0x0', label: 'LED2 torch lit and back to standby, no fault'}
        - {re: 'blazer-torch: ends: ok, chip answered 1', label: 'clean exit (EN low, pads and CLI7 put back)'}
      confirm: owner
      note: 'Flash LED (LM3644) lit under iOS: LED1 then LED2, {ms} ms each at 12 mA, kernel only; no camera sensor ({attempt})'
    built:
      all:
        - {re: 'blazer-torch: chip answered: id register 0x(?P<id>[24]), enable register 0x80', label: LM3644 id read on CLI7}
      note: 'LM3644 answered on CLI7: id 0x{id}, standby (kernel only, nothing lit) ({attempt})'
    active:
      all:
        - {re: 'blazer-torch: cli select uart -> i2c', label: CLI7 switched from the loader's UART to I2C}
      note: 'CLI7 selected as I2C under iOS; the chip did not answer ({attempt})'
    fails:
      - {re: 'blazer-torch: stop (?P<why>[a-z0-9-]+), detail 0x(?P<detail>[0-9a-f]+)', label: torch probe stopped (first stop wins)}
      - {re: 'blazer-torch: cleanup failed: (?P<why>[a-z0-9-]+)', label: restoration step failed (EN low still follows)}
      - {re: 'blazer-torch: cli not i2c; pad inventory only', label: 'CLI7 left in UART: stage 1/2 kernel (needs blazer_torch=3|4 on hk-cam1)'}
    owner: 'About 45 s after boot, did the rear flash glow twice (two short, dim pulses about 3 s apart)?'
    next: {kind: attended, minutes: 8, test: 'Boot a7-ios-system-cam1 (research/ios26-camera-r1/PHONE-TEST.md): owner watches the rear flash ~45-55 s after fastboot boot'}

  - id: camera-sensor
    phone_only: true
    milestone: true
    row: Camera sensor ID
    needs:
      markers: ['blazer-cam: ']
    built:
      all:
        - {re: 'blazer-cam: pmic slg51002 id 0x(?P<id>[0-9a-f]+)', label: 'planned (F2): camera PMIC id on CLI7'}
      note: 'Camera PMIC SLG51002 answered: id 0x{id} ({attempt})'
    works:
      all:
        - {re: 'blazer-cam: sensor (?P<name>[a-z-]+) bus (?P<bus>\S+) addr 0x(?P<addr>[0-9a-f]+) id 0x(?P<sid>[0-9a-f]+)', label: 'planned (S2): sensor powered, out of reset, chip id read'}
        - {re: 'blazer-cam: sensor \S+ powered down, rails off', label: 'planned (S2): power-down sequence completed'}
      note: 'Camera sensor {name} on {bus} 0x{addr}: id 0x{sid} ({attempt})'
    fails:
      - {re: 'blazer-cam: stop (?P<why>[a-z0-9-]+), detail 0x(?P<detail>[0-9a-f]+)', label: 'planned: camera bring-up stopped'}
    owner: 'No owner check: a log result'
    next: {kind: build, minutes: 0, test: 'F2 then S1/S2 in research/ios26-camera-r1/CAMERA.md section 4 (PMIC GPIO frames need owner approval)'}

  - id: biometrics
    phone_only: true
    row: Fingerprint, Face ID
    owner: 'Out of reach: tied to the security chip'
    next: {kind: none, minutes: 0, test: 'None'}

  - id: sep
    phone_only: false
    row: Secure enclave
    needs:
      markers: ['SWEET AKS: ']
    partial:
      all:
        - {re: 'SWEET AKS: \S+ sel 10 .*-> 0x0', label: software key store wrap}
        - {re: 'SWEET AKS: \S+ sel 11 .*-> 0x0', label: software key store unwrap}
    owner: 'Out of reach (Apple SEP absent); software key store only'
    next: {kind: none, minutes: 0, test: 'None'}

  - id: apple-services
    phone_only: true
    row: Activation, iMessage, App Store purchases
    owner: 'Out of reach: needs a real iPhone identity'
    next: {kind: none, minutes: 0, test: 'None'}

  # ---------------------------------------------------------------- milestones (not README rows)
  # milestone: true probes are evaluated like rows but never compared with status.json.
  # tools/hk_cycle.py and tools/qemu_preflight.py read them by id.

  - id: home
    phone_only: false
    milestone: true
    row: Home screen (milestone)
    needs:
      markers: ['exec SpringBoard|Successfully spawned \(SpringBoard\)']
    works:
      all:
        - {re: 'SWEET HID: SweetHIDTouch open by', label: touch client (TOUCH_CLIENT)}
        - {re: 'SWEET HID: SweetHIDButtons open by', label: button client (BUTTON_CLIENT)}
        - {re: 'HK TOP: t=\d+ frames\+[1-9]\d*|SWEET FB: rate swaps (?P<swaps>[1-9][\d.]*|0\.[1-9])/s', label: frames (FRAMES)}
        - {re: '^(?:\S+ \[\s*[\d.]+\] )?CRASH SpringBoard', min: 0, max: 0, label: no SpringBoard crash}
      any:
        - {re: 'Successfully spawned \(SpringBoard\)\[', label: SPRINGBOARD (launchd spawn line)}
        - {re: 'HKBATT: event=battery_view_installed pid=\d+', label: 'fallback: SpringBoard status-bar battery view installed'}
        - {re: 'HKBATT: event=battery_view_set ', label: 'fallback: SpringBoard battery view updated'}
      note: 'Home: touch and button clients, frames, SpringBoard UI up ({attempt})'
    partial:
      all:
        - {re: 'exec SpringBoard'}
    fails:
      - {re: '^(?:\S+ \[\s*[\d.]+\] )?CRASH SpringBoard', label: SpringBoard crashed}
    owner: 'Is the Home screen shown?'
    next: {kind: unattended, minutes: 10, test: 'Any int1 live boot; live_boot.sh UI_READY needs the SPRINGBOARD line, which int1 never prints: use this probe (battery-view fallback) instead'}

  - id: app-settings-about
    phone_only: false
    milestone: true
    row: Settings > About opens (milestone)
    needs:
      markers: ['exec Preferences|Preferences\[\d+\]|CRASH Preferences']
    works:
      all:
        - {re: 'service="kTCCServiceMediaLibrary"', label: About path ran (its MediaLibrary TCC request)}
        - {re: '^(?:\S+ \[\s*[\d.]+\] )?CRASH Preferences', min: 0, max: 0, label: no Settings crash}
      confirm: owner_or_screenshot
      note: 'Settings > About opened without a crash ({attempt})'
    partial:
      any:
        - {re: 'HKMAIN: Preferences\[\d+\] .*stalls=0', label: Settings main thread responsive}
    fails:
      - {seq: ['service="kTCCServiceMediaLibrary"', 'AUTHREQ_RESULT: msgID=\d+\.\d+, authValue=\d+', 'generic_extension="invalid"', 'CRASH Preferences reason ns 2 code 0x6'], label: 'About: MediaLibrary TCC request, then SIGABRT (ABOUT; this log shows authValue=2 with generic_extension="invalid")'}
      - {re: '^(?:\S+ \[\s*[\d.]+\] )?CRASH Preferences reason ns 2 code 0x6', label: Settings SIGABRT}
    owner: 'Does Settings > General > About open?'
    next: {kind: unattended, minutes: 10, test: 'int1 live boot with ui_settings_test.py tapping About; the probe reads CRASH Preferences and the tccd reply'}

  - id: app-accessibility-ui
    phone_only: false
    milestone: true
    row: AccessibilityUIServer stays up (milestone)
    needs:
      markers: ['exec AccessibilityUIServer|CRASH AccessibilityUIS']
    works:
      all:
        - {re: 'exec AccessibilityUIServer'}
        - {re: '^(?:\S+ \[\s*[\d.]+\] )?CRASH AccessibilityUIS', min: 0, max: 0, label: no AccessibilityUIServer crash}
    fails:
      - {re: '^(?:\S+ \[\s*[\d.]+\] )?CRASH AccessibilityUIS\S* reason ns 2 code 0x6', label: 'AccessibilityUIServer SIGABRT loop (ABOUT: root prune deleted AXSSPunctuationModel.momd; not visible in the log)'}
      - {re: 'AXSSPunctuationModel', label: 'AXSSPunctuationModel named in the log'}
    owner: 'None'
    next: {kind: unattended, minutes: 5, test: 'QEMU first (restore AXSSPunctuationModel.momd in the root); then any unattended int1 boot'}

  - id: app-blastdoor
    phone_only: false
    milestone: true
    row: MessagesBlastDoorService stays up (milestone)
    needs:
      markers: ['exec MessagesBlastDoorService|CRASH MessagesBlastDoo|MessagesBlastDoorService:\d+\]']
    works:
      all:
        - {re: 'exec MessagesBlastDoorService'}
        - {re: '^(?:\S+ \[\s*[\d.]+\] )?CRASH MessagesBlastDoo', min: 0, max: 0, label: no BlastDoor crash}
        - {re: 'MessagesBlastDoorService:\d+\] EXC_GUARD', min: 0, max: 0, label: no EXC_GUARD}
    fails:
      - {seq: ['MessagesBlastDoorService:\d+\] EXC_GUARD AST', 'CRASH MessagesBlastDoo\S* reason ns 2 code 0x5'], label: 'BlastDoor EXC_GUARD then SIGTRAP (ABOUT: Sandbox.swift trap because the SWEET sandbox stub returns 0)'}
      - {re: '^(?:\S+ \[\s*[\d.]+\] )?CRASH MessagesBlastDoo\S* reason ns 2 code 0x5', label: BlastDoor SIGTRAP}
    owner: 'None'
    next: {kind: unattended, minutes: 5, test: 'QEMU first with a sandbox stub that reports a real container profile; then any unattended int1 boot'}

  # ---------------------------------------------------------------- USB host / DP alt mode (research/ios26-phaseb-r1/usbhost/USBHOST.md)
  - id: usb-host-enumerate
    phone_only: true
    milestone: true
    row: USB host enumerates a device (milestone)
    needs:
      markers: ['blazer-usbhost: ']
      boot_args: ['blazer_usbhost=1']
      image: 'a7-ios-system-usbhost1; the device needs its own power (powered hub): the phone does not source VBUS'
    works:
      all:
        - {re: 'blazer-usbhost: ENUM port (?P<port>\d+) speed (?P<speed>\w+) dev (?P<vidpid>[0-9a-f]{4}:[0-9a-f]{4}) usb [0-9a-f]+\.[0-9a-f]{2} class (?P<class>[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{2})', label: device descriptor}
        - {re: 'blazer-usbhost: PASS, port \d+ enumerated', label: PASS line}
        - {re: '^panic\(cpu \d+ caller 0x[0-9a-f]+\): (?!blazer-root: deadline|HK GPUTA: rung \d+ PASS)', min: 0, max: 0, label: no unplanned panic}
      confirm: owner
      note: 'Port {port}: {speed}-speed {vidpid} class {class} enumerated by the kernel xHCI ({attempt})'
    partial:
      all:
        - {re: 'blazer-usbhost: port \d+ reset done, enabled 1', label: port reset and enabled}
      note: 'A device connected and its port was enabled ({attempt}); an ENUM + PASS log stops here until the owner confirms the device'
    built:
      all:
        - {re: 'blazer-usbhost: running, USBSTS [0-9a-f]+', label: xHCI running}
      note: 'xHCI running in host mode, no device connected ({attempt})'
    active:
      all:
        - {re: 'blazer-usbhost: (mode 1, wait|survey GSNPSID)', label: admitted}
    fails:
      - {re: 'blazer-usbhost: refused: (?P<why>.*)', label: refused (no register written)}
      - {re: 'blazer-usbhost: gadget no halt after', label: 'shim gadget did not halt: nothing reset (by design)'}
      - {re: 'blazer-usbhost: (core soft reset stuck|host error|port \d+ reset timeout)', label: controller fault}
      - {re: 'blazer-usbhost: (enable slot|device descriptor|first 8 bytes): ', label: command or transfer failed}
      - {re: 'blazer-usbhost: stop: no device', label: 'no connect in the window (device unpowered, or not plugged in time)'}
    owner: 'Which device (VID:PID on its label or `system_profiler SPUSBDataType` on the Mac) was plugged in, via which hub?'
    next: {kind: attended, minutes: 12, test: 'a7-ios-system-usbhost1 with a powered USB-C hub (charger on its PD input) + a USB stick (USBHOST.md)'}

  - id: dp-video-out
    phone_only: true
    milestone: true
    row: DisplayPort alt-mode picture (milestone)
    # Stage map in USBHOST.md (DP alt mode). Only stage D0 (read-only TCA/dp_top survey) exists; the rest are planned lines.
    needs:
      markers: ['blazer-usbhost: survey TCA|blazer-dp: ']
    works:
      all:
        - {re: 'blazer-dp: video out (?P<mode>\d+x\d+@\d+)', label: 'planned (D5): DPU stream on the DP encoder'}
      confirm: owner_or_screenshot
      note: 'External display shows {mode} from iOS ({attempt})'
    partial:
      all:
        - {re: 'blazer-dp: link trained (?P<rate>\w+) x(?P<lanes>\d)', label: 'planned (D4): DPTX link training'}
      note: 'DP link trained {rate} x{lanes}, no picture ({attempt})'
    built:
      all:
        - {re: 'blazer-dp: sink DPCD rev (?P<rev>[0-9a-f.]+)', label: 'planned (D3): AUX read of the sink DPCD'}
      any:
        - {re: 'blazer-dp: altmode entered, pin assignment (?P<pin>[CDE])', label: 'planned (D1/D2): PD Enter Mode + Configure'}
      note: 'AUX channel up, sink DPCD {rev} ({attempt})'
    active:
      all:
        - {re: 'blazer-usbhost: survey TCA clk_rst [0-9a-f]+ intr_sts [0-9a-f]+ gcfg [0-9a-f]+ tcpc (?P<tcpc>[0-9a-f]+)', label: 'D0: TCA mux state read (read only)'}
      note: 'USB/DP combo PHY TCA read: TCA_TCPC {tcpc} (mux [2:0]: 1 USB, 2 DP, 3 both) ({attempt})'
    owner: 'Was a USB-C DisplayPort adapter or monitor plugged in, and did it show anything?'
    next: {kind: build, minutes: 0, test: 'D1: read-only TCPC registers over SPMI (SID 4: CC_STATUS, TCPC_CONTROL, SBUSW_CTRL 0x94) with the power owner (blazer_gauge transport); then a PD VDM engine (owner decision: PD transmit)'}
