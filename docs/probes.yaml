        - {re: 'blazer-haptic: trigger rom \d+'}
        - {re: 'blazer-haptic: tap \d+ rc 0'}
    owner: 'Did you feel a buzz on touch?'
    next: {kind: attended, minutes: 5, test: 'Felt buzz is human-only; regression via the rc 0 lines'}

  # ---------------------------------------------------------------- Sensors
  - id: sensors
    phone_only: true
