# int3 QEMU probes, loaded after tools/qemu_preflight.expect.yaml (replaces rows by id).
# int3 = int2-ui debug + obs1 mirror + ABOUT's 3 covers + ABOUT's narrow BlastDoor sandbox self-check.
# QEMU uses the read-only phone root r3, so only the 4 overlay covers are present; the SYSTEMIC prune
# crashes (MobileSMS/FaceTime/Health/Photos/... = root r5 scope) are NOT fixed by int3 and are recorded
# by the run console, not forbidden here. These rows assert int3's own provable positives.
respawn_allow:
  # known root-prune prewarm crashers (root r5 scope, out of int3): do not fail the int3 proof on them
  MobileSMS: 400
  FaceTime: 400
  Health: 400
  Photos: 400
  Freeform: 400
  Journal: 400
  VoiceMemos: 400
  Magnifier: 400
  AppleVisionProAp: 400
  Preferences: 400
  MobilePhone: 400
expect:
  - {id: hk_dbg-parsed, feature: int2-ui debug boot-arg hk_dbg=0x1e1e1f, phone_only: true,
     need: ['HK DBG: hk_dbg=0x1e1e1f'],
     note: 'the HK DBG confirmation line is emitted by blazer_usbcon_start, which is phone-only (no DWC3 USB console in TCG); run with --keep hk_dbg=0x1e1e1f so QEMU boots the real int3 line, but the line itself is phone-observable only.'}
  - {id: overlay-65, feature: int3 overlay (65 entries, 676376 bytes) parsed and applied,
     need: ['varfs-overlay: .*65 entries, 676376 bytes', 'varfs-overlay: [1-9]\d* applied'],
     forbid: ['varfs-overlay: bad overlay']}
  - {id: about-covers, feature: ABOUT covers mounted (ml-en, ax-punct, ax-vopron + int1 coreui),
     need: ['hkcover: 4 of \d+ covers from the overlay',
            'hkcover: /System/Library/PrivateFrameworks/MusicLibrary.framework/en.lproj',
            'hkcover: /System/Library/PrivateFrameworks/AccessibilitySharedSupport.framework/AXSSPunctuationModel.momd',
            'hkcover: /System/Library/PrivateFrameworks/AccessibilitySharedSupport.framework/VOPronunciationModel.momd']}
  - {id: obs-dyld-merge, feature: obs1 one merged DYLD_INSERT_LIBRARIES per program,
     need: ["hk_env: SpringBoard: 2 rules' libraries in one DYLD_INSERT_LIBRARIES"]}
  - {id: obs-hkobs, feature: HKOBS driver-status lines every 10 s,
     need: ['HKOBS \d+ tick t=\d+ '], values: [{re: 'HKOBS (\d+) tick t=', agg: count, min: 3}]}
  - {id: obs-mirror, feature: daemon log mirror writes HKL lines (budget drops 0),
     need: ['HKL (lsd|tccd|configd|SpringBoard)\[\d+\] '], forbid: ['con: .*dropped [1-9]']}
  - {id: no-blastdoor-sandbox-crash, feature: ABOUT sandbox self-check keeps BlastDoor alive,
     forbid: ['BlastDoor cannot run unsandboxed', 'CRASH MessagesBlastDoo', 'usertrap: MessagesBlastDoo'],
     note: 'TCG may not launch BlastDoor; zero-event is not an interactive launch proof.'}
  - {id: no-ax-crash, feature: AccessibilityUIServer no longer aborts (ax covers restore the .mom models),
     forbid: ['CRASH AccessibilityUIS', 'Cannot create an NSPersistentStoreCoordinator with a nil model'],
     note: 'positive if AccessibilityUIServer runs in TCG; else zero-event.'}
