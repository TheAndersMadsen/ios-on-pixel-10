name: Tests

on:
  push:
    branches: [ios26]
  pull_request:
    branches: [ios26]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-files:
    name: No dumps, firmware or identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the check reads file names across history
      - run: python3 -I .github/scripts/check_tracked.py --history

  tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: .github/scripts/ci-tests.sh
