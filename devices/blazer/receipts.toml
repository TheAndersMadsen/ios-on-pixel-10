[[claim]]
area = "configuration"
status = "device-verified"
findings = ["One pinned image boots every proven feature together: kernel hk-integ-1 = hk-base-2 c1f11d3 + the five wifi W5 commits, overlay and boot line from tools/image_tool.py.", "Kernel features are enabled by boot-line tokens (hk_dbg bits, hk_pw packed token, /chosen/hk-boot-args-extra), not by build configuration; the 1023-byte boot line is the shared budget."]
limits = ["Kernel sources are pinned in the separate XNU repository (branch commits in each receipt), not by this repository.", "No per-driver build switch yet: CONFIG_HAKIOS_<NAME> gates and devices/blazer/device.conf are being added by the port lane."]
next_action = ["Land devices/blazer/device.conf with CONFIG_HAKIOS_<NAME> per driver and the pinned XNU commit, so one file names the whole configuration (port lane)."]

[[claim]]
area = "firmware"
status = "device-verified"
findings = ["Stock ABL (deepspace-17.4-16424240) runs an unsigned fastboot boot image; the shim takes UniXNU firmware + boot manager + DarwinBoot roles: it builds the ADT, boot-args and memory handoff and enters XNU at EL1.", "A forced-fastboot arm plus the host reset op parks the phone with RAM intact, so every boot ends in a known state."]
limits = ["No UEFI, no menu on the iOS path in these boots; the chooser (Android/iOS) is built but its iOS entry from volume keys is not yet proven physically."]
next_action = ["Physical chooser boot: select iOS with the volume keys and reach Home (coordinator, attended)."]

[[claim]]
area = "cpu"
status = "device-verified"
findings = ["Five A725 cores run iOS with SGI/IPI delivery; the governor writes clock levels and the common-health gates (verified clocks, required thermal zones 0x106, 70 C guard) admit."]
limits = ["5 of 8 cores: the two A520 and the X4 are not admitted.", "Clock cap level 16 (1075 MHz); >= 1536 MHz written and measured has no physical sample."]
next_action = ["Boot power-5: cap 13 with the common-health gates and a 55 C abort (power lane)."]

[[claim]]
area = "memory"
