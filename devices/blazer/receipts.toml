limits = ["About 2.5 GiB is not given to XNU; PCIe0 amb_smmu state is unread."]
next_action = ["Account for the remaining DRAM against the firmware carve-outs, then raise MEM_SIZE in tools/mkadt.py (kernel base owner)."]

