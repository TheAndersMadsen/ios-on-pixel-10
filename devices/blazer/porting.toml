# hackios porting record in UniXNU format 1. Generated by tools/unixnu_record.py from receipts.toml (claims and
# bound physical receipts) and docs/status.json: do not edit; edit receipts.toml and regenerate.
schema_version = 1

[device]
name = "blazer"
soc = "laguna"
os_profile = "ios-26.6.2-23G90"
summary = "Google Pixel 10 Pro (blazer, Tensor G5) running XNU 12377 and the iOS 26.6.2 userland through hackios (own shim, ADT and drivers; not built on the UniXNU tree; no UniXNU components). Generated from docs/status.json of 2026-11-04."

[[area]]
id = "configuration"
status = "device-verified"
components = []
paths = ["docs/status.json", "tools/unixnu_record.py", "tools/image_tool.py", ".github/**"]
inputs = ["XNU 12377 (local series based on ios-tegu), iOS 26.6.2 (23G90) userland, Tensor G5 board blazer."]
configuration = ["Drivers are chosen per build: devices/blazer/configs/*.config (CONFIG_HAKIOS_<NAME>) through tools/hk_port_config.py into the XNU tree's HAKIOS_DRIVERS line; devices/blazer/device.conf holds one status line per driver.", "Image inputs are pinned by sha256 in tools/image_tool.py and docs/BUILD.md; boot-args only from the tool list."]
procedure = ["python3 tools/hk_port_config.py apply devices/blazer/configs/CONFIG, then check; python3 tools/hk_device.py check.", "python3 -I tools/image_tool.py image NAME --kernel K --kernel-sha SHA ... (docs/BUILD.md)."]
findings = ["One pinned image boots every proven feature together (integ-1: hk-integ-1; integ-5: common base hk-base-3 with all 27 drivers of that base built in).", "Per-driver build configuration exists and is proven on the phone: each driver is the XNU option HAKIOS_<NAME> (CONFIG_HAKIOS_<NAME> in devices/blazer/configs/), and kernels with 3, 6, 10 and 8 drivers built in boot to SpringBoard and print which drivers they hold (ladder steps 0, 1, 1b, 2).", "devices/blazer/device.conf holds one status line per driver (28), each physical line quoting console lines of a named boot; tools/hk_device.py checks it against the XNU tree and the logs.", "Run-time features stay behind boot-line tokens (hk_dbg bits, hk_pw packed token, /chosen/hk-boot-args-extra); the 1023-byte boot line is the shared budget."]
completion = ["Every input of an image resolves to a pinned hash; the manifest names kernel, ADT, payload and argv."]
limits = ["Kernel sources are pinned in the separate XNU repository (branch commits in each receipt), not by this repository.", "Ladder steps 3 to 7 (UFS read-only union, GPU, battery, Wi-Fi, haptic/torch/NFC/modem/BT) are written configurations with no phone boot of their own kernel yet.", "WDT, HALT, SLEEP and POWERMON are compiled only (no console line of theirs in any boot); AUDIO has run in QEMU only."]
next_action = ["Boot ladder step 3 (configs/step3.config on hk-port-2), then one driver per boot in the order of device.conf (port lane)."]

