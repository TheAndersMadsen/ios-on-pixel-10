[[area]]
id = "memory"
status = "device-verified"
components = []
paths = ["tools/mkadt.py"]
inputs = ["16 GiB LPDDR; low bank holds firmware carve-outs; kernel window in an upper bank (tools/mkadt.py)."]
configuration = ["PHYS_BASE and MEM_SIZE in tools/mkadt.py; --window-base of tools/image_tool.py."]
procedure = ["Memory test and 15-minute runs under iOS."]
findings = ["XNU owns 13.5 GiB (max_mem 0x35ef80000) of 16 GiB; DMA from UFS and the Wi-Fi rings completes.", "Carve-outs below 4 GiB map Device-GRE under WCOMB (outside XNU DRAM window); never bzero them (FACTS audio entry).", "README checklist (docs/status.json 2026-11-04): Memory and shared cluster clocks: works on the phone; RAM: works on the phone; The rest of the 16 GiB: not started."]
completion = ["All RAM is owned or explicitly reserved; DMA engines use their documented ranges."]
limits = ["About 2.5 GiB is not given to XNU; PCIe0 amb_smmu state is unread."]
next_action = ["Account for the remaining DRAM against the firmware carve-outs, then raise MEM_SIZE in tools/mkadt.py (kernel base owner)."]

