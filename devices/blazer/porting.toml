schema_version = 1

[device]
name = "blazer"
soc = "laguna"
os_profile = "ios-26.6.2-23G90"
summary = "Google Pixel 10 Pro (blazer, Tensor G5) running XNU 12377 and the iOS 26.6.2 userland through hackios (own shim, ADT and drivers; not built on the UniXNU tree; no UniXNU components). Generated from docs/status.json of 2026-11-04."

[[area]]
id = "configuration"
status = "device-verified"
components = []
paths = ["docs/status.json", "tools/unixnu_record.py", "tools/image_tool.py", ".github/**"]
inputs = ["XNU 12377 (local series based on ios-tegu), iOS 26.6.2 (23G90) userland, Tensor G5 board blazer."]
configuration = ["Image inputs are pinned by sha256 in tools/image_tool.py and docs/BUILD.md; boot-args only from the tool list."]
procedure = ["python3 -I tools/image_tool.py image NAME --kernel K --kernel-sha SHA ... (docs/BUILD.md)."]
findings = ["One pinned image boots every proven feature together: kernel hk-integ-1 = hk-base-2 c1f11d3 + the five wifi W5 commits, overlay and boot line from tools/image_tool.py.", "Kernel features are enabled by boot-line tokens (hk_dbg bits, hk_pw packed token, /chosen/hk-boot-args-extra), not by build configuration; the 1023-byte boot line is the shared budget."]
completion = ["Every input of an image resolves to a pinned hash; the manifest names kernel, ADT, payload and argv."]
limits = ["Kernel sources are pinned in the separate XNU repository (branch commits in each receipt), not by this repository.", "No per-driver build switch yet: CONFIG_HAKIOS_<NAME> gates and devices/blazer/device.conf are being added by the port lane."]
next_action = ["Land devices/blazer/device.conf with CONFIG_HAKIOS_<NAME> per driver and the pinned XNU commit, so one file names the whole configuration (port lane)."]

[[area.evidence]]
kind = "source"
reference = "docs/BUILD.md"
result = "configuration: current statements and routes."

[[area.evidence]]
kind = "device"
reference = "evidence/a7-integ-r1.txt"
result = "PHYSICAL a7-integ-r1: Pinned image (sha256 67c6c2e7...) with kernel hk-integ-1 booted to Home at +50 s and Settings>Wi-Fi; boot line 768 B + 148 B /chosen/hk-boot-args-extra."
command = "bash tools/hk_boot_job.sh a7-ios-system-integ-r1 a7-integ-r1 <MACH> <WAIT> <EXPECT> <UI>; python3 -I tools/hk_score.py --brief <live dir>"
revision = "22e4e7db52f56d94fbd391dfb1d0163b2a8b3888"

[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["shim/**"]
inputs = ["Stock ABL (unlocked) loads a temporary fastboot boot image; no UEFI. The shim enters at EL2."]
configuration = ["shim/ chooser: menu, volume keys, 5 s default to Android; Android entry chain-loads the stock kernel."]
procedure = ["fastboot boot of the image built by tools/image_tool.py or tools/chooser_image.py; return check after every boot."]
findings = ["Stock ABL (deepspace-17.4-16424240) runs an unsigned fastboot boot image; the shim takes UniXNU firmware + boot manager + DarwinBoot roles: it builds the ADT, boot-args and memory handoff and enters XNU at EL1.", "A forced-fastboot arm plus the host reset op parks the phone with RAM intact, so every boot ends in a known state.", "README checklist (docs/status.json 2026-11-04): Android/iOS boot chooser: works on the phone."]
completion = ["The shim reaches XNU entry at EL1 with ADT and boot-args; the chooser boots Android unchanged."]
limits = ["No UEFI, no menu on the iOS path in these boots; the chooser (Android/iOS) is built but its iOS entry from volume keys is not yet proven physically."]
next_action = ["Physical chooser boot: select iOS with the volume keys and reach Home (coordinator, attended)."]

