# devices/blazer/device.conf: the Pixel 10 Pro (blazer, Tensor G5 "laguna") as a device of this port.
# Method: HakiOS devices/<name>/device.conf (one status line per driver) + UniXNU's porting guide. The drivers themselves,
# their files and requires, are declared in the XNU tree (branch hk-port-1, config/hakios/*.drivers); configs/ chooses them.
#
# status NAME  STATE  ladder=N  gate=<boot-args that turn it on at run time>  proof=<evidence>
#   STATE  physical  a phone boot printed the quoted console line (attempt dir under research/laguna-usb-fix/attempts/)
#          qemu      only QEMU showed it          compiled  built and linked, never seen running
# A driver is "done" in the HakiOS sense when its line says physical. `step=` is the proof from its own LADDER kernel
# (only the drivers of that step and below built in: devices/blazer/configs/), the stronger claim; hk_device.py greps it too.
# Ladder boots: port-0 = minimal (step 0), port-1 = step 1 (both 2026-11-12, physical); queued port-2 = 1b, port-3 = 2. Ladder steps: 0 boot path (minimal.config),
# 1 CPUFREQ/THERMAL/SOCINFO (step1.config), 2 BUTTONS+TOUCH, 3 UFS read-only, 4 GPU, 5 audio/battery, 6 WIFI,
# 7 haptic/camera/torch/modem/BT/NFC. `tools/hk_device.py check` keeps this file, configs/ and the XNU tree agreeing.

device blazer
	title       Google Pixel 10 Pro (blazer)
	vendor      Google
	soc         Tensor G5 (laguna)
	kernel      XNU 12377, branch hk-port-1 (/data/work/hk-knext/xnu)
	defconfig   configs/blazer_defconfig
	minimal     configs/minimal.config
	maintainer  hackios (NOTES.md)

	status USBCON   physical  ladder=0  gate=blazer_usbcon=1|2  proof=live-20261111-231212-a7-integ-r1 "blazer-usbcon: mode 2, arena 0xbe917000, first DWC3 read next"  step=live-20261112-005947-a7-port0-r1 "hakios-kernel: 3 drivers built in (DISPLAY UFS USBCON), 24 left out"
	status UFS      physical  ladder=0  gate=blazer_ufs=2,blazer_ufs_live=1,blazer_ufs_root=ios_system,rd=ufsroot0  proof=live-20261111-231212-a7-integ-r1 "blazer-ufs: \"ios_system\" on LUN 0: first block 15b4000, 24576 MiB, read only, DMA at 88a424000"  step=live-20261112-005947-a7-port0-r1 "blazer-ufs: \"ios_system\" on LUN 0: first block 15b4000, 24576 MiB, read only, DMA at 88a0c4000"
	status DISPLAY  physical  ladder=0  gate=always (AppleCLCD); hk_fb_scanout,hk_bright,hk_scaler,hk_accel tune it  proof=live-20261111-231212-a7-integ-r1 "tensor-dpu: attached: layer 0 at 0xf0000000 1280x2856 stride 5120 qos 0"; brightness 20261104-001328-a7-int3-gpuprobe "tensor-dpu: bright transport sent_dbv 2812 (~46.8 nits) cap 140 acl_off 1 rc 0 n 104"  step=live-20261112-005947-a7-port0-r1 "tensor-dpu: attached: layer 0 at 0xf0000000 1280x2856 stride 5120 qos 0" (port-0 drew no Home by +73 s; Home first drawn in the step-1 kernel live-20261112-010704-a7-port1-r1 "SWEET FB: rate swaps 64.1/s"; port-0b asks)
