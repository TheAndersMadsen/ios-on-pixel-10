# devices/blazer/device.conf: the Pixel 10 Pro (blazer, Tensor G5 "laguna") as a device of this port.
# Method: HakiOS devices/<name>/device.conf (one status line per driver) + UniXNU's porting guide. The drivers themselves,
# their files and requires, are declared in the XNU tree (branch hk-port-2, config/hakios/*.drivers); configs/ chooses them.
# Each driver NAME below is also its build symbol CONFIG_HAKIOS_<NAME> (XNU option HAKIOS_<NAME>, attribute hakios_<name>):
# 28 drivers, 28 symbols, 28 status lines; configs/blazer_defconfig and configs/minimal.config name every one of them.
#
# Provenance of this file. A `physical` line quotes console lines of phone boots whose logs are under
# research/laguna-usb-fix/attempts/<attempt> (outside git; bounded excerpts of the decisive boots: evidence/*.txt).
# Checked 2026-11-13 (devices lane, host only, phone offline): EVERY quoted line of every proof= and step= was found in the
# attempt named before it; the source file that prints each first proof line belongs to that driver in config/hakios; the
# lines the `compiled` drivers would print ("blazer-wdt:", "blazer-halt:", "blazer-sleep:", "blazer-power:", "HK NTC:",
# "HK ODPM:", "HK BCL:", "HK POWER:") and AUDIO's "blazer-audio:" are in no attempt. Cross-checked against NOTES.md's
# done-list as audited 2026-11-13/14 (/data/work/hk-score/AUDIT-20261113.md) and `hk_score.py --best --since 20261104`
# (118 boots). Where a driver's numbers came from (vendor source, device tree, a capture on this phone) is the head
# comment of its source files in the XNU tree, not this file.
#
# status NAME  STATE  ladder=N  gate=<boot-args that turn it on at run time>  proof=<evidence>  [step=<evidence>]
#   STATE  physical  a phone boot printed the quoted console line, and the driver's own code printed it (AOC_FW has
#                    no code: the AOC driver it requires reports its image)
#          qemu      only QEMU showed it          compiled  built and linked, never seen running on the phone
#   proof= <attempt> "<console line>" [; more]. Text after `limit:` says what the phone has NOT shown for this driver (a
#          FAIL line quoted there is evidence too). A state is never raised without a quoted line in an attempt.
#   step=  the proof from the driver's own LADDER kernel (only the drivers of that step and below built in:
#          devices/blazer/configs/), the stronger claim; hk_device.py greps it too.
# A driver is "done" in the HakiOS sense when its line says physical and carries no `limit:`.
# Ladder boots (2026-11-12, physical, kernels on hk-port-1 = hk-base-2): port-0/0b = minimal (step 0, Home at +79 s),
# port-1 = step 1, port-2 = step 1b, port-3 = step 2. From step 3 on the ladder is XNU hk-port-2 (hk-base-5 8b99410 + the
# stubs commit 96db889); steps 3-7 are written configurations (stepN.config), none booted yet: no step= proof for them.
# Ladder steps: 0 boot path (minimal.config), 1 CPUFREQ/THERMAL/SOCINFO (step1.config; 1b + RTC CLKMON WDT HALT),
# 2 BUTTONS+TOUCH, 3 UFS read-only (= 1b + 2, no new driver), 4 GPU, 5 battery/charger (audio later), 6 WIFI,
# 7 haptic/camera/torch/modem/BT/NFC (stepN.config). `tools/hk_device.py check` keeps this file, configs/ and the XNU tree agreeing.

